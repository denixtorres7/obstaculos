<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corredor de obstáculos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f1f1f1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      width: min(900px, 95vw);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .juego {
      position: relative;
      width: 100%;
      height: 280px;
      overflow: hidden;
      border: 4px solid #222;
      border-radius: 16px;
      background: #87ceeb;
      transition: background 1s;
    }

    .juego.bosque {
      background: #98d67b;
    }

    .juego.nieve {
      background: #dff4ff;
    }

    .suelo {
      position: absolute;
      bottom: 50px;
      width: 200%;
      height: 4px;
      background: repeating-linear-gradient(
        90deg,
        #444 0,
        #444 20px,
        transparent 20px,
        transparent 40px
      );
      animation: moverSuelo 1s linear infinite;
    }

    @keyframes moverSuelo {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    .jugador {
      position: absolute;
      left: 70px;
      bottom: 54px;
      width: 42px;
      height: 62px;
    }

    .cabeza {
      position: absolute;
      width: 28px;
      height: 28px;
      background: #ffd166;
      border: 3px solid #222;
      border-radius: 6px;
      left: 7px;
      top: 0;
    }

    .cabello {
      position: absolute;
      width: 30px;
      height: 10px;
      background: #5a3825;
      top: -5px;
      left: -4px;
      border-radius: 8px;
    }

    .cuerpo {
      position: absolute;
      width: 36px;
      height: 26px;
      background: #ff4d6d;
      border: 3px solid #222;
      left: 3px;
      top: 26px;
      border-radius: 4px;
    }

    .pierna {
      position: absolute;
      width: 10px;
      height: 20px;
      background: #6a4c93;
      border: 2px solid #222;
      top: 50px;
      animation: correr 0.25s infinite alternate;
      transform-origin: top center;
    }

    .pierna1 {
      left: 8px;
    }

    .pierna2 {
      left: 24px;
      animation-delay: 0.12s;
    }

    @keyframes correr {
      from { transform: rotate(18deg); }
      to { transform: rotate(-18deg); }
    }

    .jugador.agachado {
      height: 42px;
    }

    .jugador.agachado .pierna {
      animation: none;
      transform: rotate(90deg);
      top: 40px;
    }

    .obstaculo {
      position: absolute;
      bottom: 54px;
      width: 30px;
      height: 50px;
      background: #00b4d8;
      border: 3px solid #222;
      border-radius: 4px;
    }

    .mensaje {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: rgba(255,255,255,0.7);
      gap: 10px;
    }

    .oculto {
      display: none;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="contenedor">
    <h1>Corredora de obstáculos</h1>

    <div class="info">
      <span>Puntaje: <span id="puntaje">0</span></span>
      <span>Récord: <span id="record">0</span></span>
    </div>

    <section class="juego" id="juego">
      <div class="suelo" id="suelo"></div>
      <div class="jugador" id="jugador">
        <div class="cabeza">
          <div class="cabello"></div>
        </div>
        <div class="cuerpo"></div>
        <div class="pierna pierna1"></div>
        <div class="pierna pierna2"></div>
      </div>
      <div class="mensaje" id="mensaje">
        <strong>Presiona espacio, ↑ o toca la pantalla para saltar</strong>
        <button id="btnInicio">Iniciar juego</button>
      </div>
    </section>

    <p class="ayuda">Controles: barra espaciadora, flecha arriba o toque en pantalla.</p>
  </main>

  <script>
    const juego = document.getElementById("juego");
    const jugador = document.getElementById("jugador");
    const mensaje = document.getElementById("mensaje");
    const btnInicio = document.getElementById("btnInicio");
    const puntajeTexto = document.getElementById("puntaje");
    const recordTexto = document.getElementById("record");
    const suelo = document.getElementById("suelo");

    let jugando = false;
    let perdio = false;
    let saltando = false;
    let velocidad = 6;
    let gravedad = 0.8;
    let impulsoSalto = 16;
    let velocidadVertical = 0;
    let posicionY = 0;
    let puntaje = 0;
    let record = Number(localStorage.getItem("recordCorredor")) || 0;
    let obstaculos = [];
    let intervaloObstaculos;
    let animacion;

    recordTexto.textContent = record;

    function iniciarJuego() {
      jugando = true;
      perdio = false;
      saltando = false;
      velocidad = 6;
      velocidadVertical = 0;
      posicionY = 0;
      puntaje = 0;
      obstaculos.forEach(obstaculo => obstaculo.elemento.remove());
      obstaculos = [];
      puntajeTexto.textContent = puntaje;
          cambiarFondo();
      mensaje.classList.add("oculto");
      suelo.style.animationPlayState = "running";

      clearInterval(intervaloObstaculos);
      intervaloObstaculos = setInterval(crearObstaculo, 1300);

      cancelarAnimacion();
      bucleJuego();
    }

    function cancelarAnimacion() {
      if (animacion) cancelAnimationFrame(animacion);
    }

    function saltar() {
      if (!jugando || perdio) {
        iniciarJuego();
        return;
      }

      if (!saltando) {
        saltando = true;
        velocidadVertical = impulsoSalto;
      }
    }

    function crearObstaculo() {
      if (!jugando || perdio) return;

      const elemento = document.createElement("div");
      const esBajo = Math.random() > 0.55;
      elemento.className = esBajo ? "obstaculo bajo" : "obstaculo";
      juego.appendChild(elemento);

      obstaculos.push({
        elemento,
        x: juego.clientWidth + 40,
        pasado: false
      });
    }

    function actualizarJugador() {
      if (saltando) {
        posicionY += velocidadVertical;
        velocidadVertical -= gravedad;

        if (posicionY <= 0) {
          posicionY = 0;
          saltando = false;
          velocidadVertical = 0;
        }
      }

      jugador.style.bottom = `${60 + posicionY}px`;
    }

    function cambiarFondo() {
      juego.classList.remove("bosque", "nieve");

      if (puntaje >= 100 && puntaje < 200) {
        juego.classList.add("bosque");
      }

      if (puntaje >= 200) {
        juego.classList.add("nieve");
      }
    }

    function actualizarObstaculos() {
      obstaculos.forEach((obstaculo, index) => {
        obstaculo.x -= velocidad;
        obstaculo.elemento.style.left = `${obstaculo.x}px`;

        if (!obstaculo.pasado && obstaculo.x + obstaculo.elemento.offsetWidth < 70) {
          obstaculo.pasado = true;
          puntaje += 10;
          puntajeTexto.textContent = puntaje;
          cambiarFondo();

          if (puntaje % 50 === 0) {
            velocidad += 0.6;
          }
        }

        if (obstaculo.x < -80) {
          obstaculo.elemento.remove();
          obstaculos.splice(index, 1);
        }
      });
    }

    function detectarColision() {
      const rectJugador = jugador.getBoundingClientRect();

      for (const obstaculo of obstaculos) {
        const rectObstaculo = obstaculo.elemento.getBoundingClientRect();

        const colision =
          rectJugador.left < rectObstaculo.right &&
          rectJugador.right > rectObstaculo.left &&
          rectJugador.top < rectObstaculo.bottom &&
          rectJugador.bottom > rectObstaculo.top;

        if (colision) {
          terminarJuego();
          break;
        }
      }
    }

    function terminarJuego() {
      jugando = false;
      perdio = true;
      clearInterval(intervaloObstaculos);
      suelo.style.animationPlayState = "paused";

      if (puntaje > record) {
        record = puntaje;
        localStorage.setItem("recordCorredor", record);
        recordTexto.textContent = record;
      }

      mensaje.innerHTML = `
        <strong>Juego terminado</strong>
        <p>Puntaje final: ${puntaje}</p>
        <button id="btnReinicio">Jugar de nuevo</button>
      `;
      mensaje.classList.remove("oculto");
      document.getElementById("btnReinicio").addEventListener("click", iniciarJuego);
    }

    function bucleJuego() {
      if (!jugando) return;

      actualizarJugador();
      actualizarObstaculos();
      detectarColision();

      animacion = requestAnimationFrame(bucleJuego);
    }

    document.addEventListener("keydown", (evento) => {
      if (evento.code === "Space" || evento.code === "ArrowUp") {
        evento.preventDefault();
        saltar();
      }

      if (evento.code === "ArrowDown") {
        jugador.classList.add("agachado");
      }
    });

    document.addEventListener("keyup", (evento) => {
      if (evento.code === "ArrowDown") {
        jugador.classList.remove("agachado");
      }
    });

    juego.addEventListener("click", saltar);
    juego.addEventListener("touchstart", saltar);
    btnInicio.addEventListener("click", iniciarJuego);
  </script>
</body>
</html>
