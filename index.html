<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corredora de obstáculos</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #111;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .contenedor {
      width: 2436px;
      max-width: 100vw;
      margin: auto;
    }

    .info {
      position: absolute;
      z-index: 20;
      top: 25px;
      left: 40px;
      right: 40px;
      display: flex;
      justify-content: space-between;
      color: white;
      font-size: 36px;
      font-weight: bold;
      text-shadow: 3px 3px 0 #000;
    }

    #btnMusica{

   position:absolute;

   top:90px;
   right:40px;

   z-index:50;

   padding:12px 24px;

   font-size:26px;

   border-radius:15px;

   background:#ffd166;

   border:4px solid #000;

   cursor:pointer;

}

    .juego {
      position: relative;
      width: 2436px;
      height: 1125px;
      max-width: 100vw;
      max-height: 100vh;
      overflow: hidden;
      background-image: url("fondo.png");
      background-size: cover;
      background-repeat: repeat-x;
      background-position: 0 bottom;
      animation: moverFondo 18s linear infinite;
    }

    @keyframes moverFondo {
      from {
        background-position: 0 bottom;
      }

      to {
        background-position: -2436px bottom;
      }
    }

    .juego.pausado {
      animation-play-state: paused;
    }

    .jugador{
      position:absolute;
      left:240px;
      bottom:150px;

      width:120px;
      height:180px;

      z-index:10;

      animation:rebote .25s infinite alternate;
}

@keyframes rebote{

   from{
      transform:translateY(0px);
   }

   to{
      transform:translateY(-6px);
   }

}

    .cabeza{
        position:absolute;

      width:70px;
      height:70px;
      background: #ffd166;
      border-radius: 18px;
      left:28px;
      border:5px solid #000;
      top: 8px;
      transform:rotate(18deg);
      
    }

.cabello{
  position:absolute;
  width:50px;
  height:18px;
  background:#5a3825;
  top:-8px;
  left:2px;
  border-radius:20px;
  border:3px solid #000;
}

.cabello::before{
  content:"";
  position:absolute;
  width:24px;
  height:24px;
  background:#5a3825;
  border:3px solid #000;
  border-radius:50%;
  left:-22px;
  top:10px;
}

.cabello::after{
  content:"";
  position:absolute;
  width:8px;
  height:8px;
  background:#ff4d6d;
  border-radius:50%;
  left:-10px;
  top:19px;
}

    .ojo{

      position:absolute;

      width:8px;
      height:8px;

      background:#000;

      border-radius:50%;

      right:5px;
      top:20px;
    }

.cuerpo{
  position:absolute;
  width:80px;
  height:58px;
  background:#ff4d6d;
  border:5px solid #000;
  left:10px;
  top:68px;
  border-radius:12px;
  overflow:visible;
  transform:rotate(18deg);
}    

.pierna{

    position:absolute;

    width:24px;
    height:62px;

    background:#6a4c93;

    border:4px solid #000;

    border-radius:8px;

    top:115px;

    transform-origin:top center;
}


/* pierna atrás */

.piernaAtras{

    left:30px;

    z-index:1;

    opacity:.55;

    animation:piernaAtras .25s infinite alternate;
}


/* pierna delante */

.piernaFrente{

    left:30px;

    z-index:12;

    animation:piernaFrente .25s infinite alternate;
}


@keyframes piernaFrente{

    from{

        transform:
        rotate(-50deg);

    }

    to{

        transform:
        rotate(35deg);

    }

}


@keyframes piernaAtras{

    from{

        transform:
        rotate(35deg);

    }

    to{

        transform:
        rotate(-50deg);

    }

}

    .brazo{

    position:absolute;

    width:18px;
    height:45px;

    background:#ffd166;

    border:4px solid #000;

    border-radius:10px;

    transform-origin:top center;

    animation:brazos .25s infinite alternate;
}


/* brazo atrás */

.brazoAtras{

   left:5px;

   top:5px;


   z-index:20;

   animation-delay:.12s;
}


/* brazo adelante */

.brazoFrente{

   right:5px;

   top:10px;
  opacity:.0;


   z-index:1;
}


@keyframes brazos{

from{

   transform:rotate(55deg);

}

to{

   transform:rotate(-55deg);

}

}

    .obstaculo {
      position: absolute;
      bottom: 168px;
      width: 260px;
      height: 200px;
      background-image: url("Obstaculo 2.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center bottom;
      z-index: 8;
    }

    .obstaculo.hueco {
      bottom: 40px;
      width: 330px;
      height: 180px;
      background-image: url("Obstaculo 1.png");
    }

    .mensaje {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 28px;
      background: rgba(0, 0, 0, 0.45);
      color: white;
      text-align: center;
      font-size: 42px;
      text-shadow: 3px 3px 0 #000;
    }

    .oculto {
      display: none;
    }

    button {
      padding: 24px 42px;
      border: 6px solid #000;
      border-radius: 18px;
      background: #ffd166;
      color: #000;
      cursor: pointer;
      font-size: 34px;
      font-weight: bold;
    }

    button:hover {
      background: #ffb703;
    }

    .ayuda {
      position: absolute;
      bottom: 25px;
      left: 40px;
      z-index: 20;
      color: white;
      font-size: 28px;
      text-shadow: 3px 3px 0 #000;
    }
  </style>
</head>

<body>
  <main class="contenedor">
    <div class="info">
      <span>Puntaje: <span id="puntaje">0</span></span>
      <span>Nivel: <span id="nivel">1</span></span>
      <span>Vidas: <span id="vidas">3</span></span>
      <span>Récord: <span id="record">0</span></span>
      <button id="btnMusica">🔊 Música</button>
    </div>

    <section class="juego pausado" id="juego">
      <div class="jugador" id="jugador">
        <div class="cabeza">
        <div class="cabello"></div>
        <div class="ojo"></div>
      </div>
        <div class="cuerpo">
        <div class="brazo brazoAtras"></div>
        <div class="brazo brazoFrente"></div>
      </div>
      <div class="pierna piernaFrente"></div>
      <div class="pierna piernaAtras"></div>
      </div>

      <div class="mensaje" id="mensaje">
        <strong>Presiona espacio, ↑ o toca la pantalla para saltar</strong>
        <button id="btnInicio">Iniciar juego</button>
      </div>
    </section>

    <p class="ayuda">Controles: barra espaciadora, flecha arriba o toque en pantalla.</p>
  </main>

  <script>
const juego = document.getElementById("juego");
const jugador = document.getElementById("jugador");
const mensaje = document.getElementById("mensaje");
const btnInicio = document.getElementById("btnInicio");
const puntajeTexto = document.getElementById("puntaje");
const recordTexto = document.getElementById("record");
const vidasTexto = document.getElementById("vidas");
const nivelTexto = document.getElementById("nivel");
const btnMusica =
document.getElementById("btnMusica");

let musicaActiva=true;

let jugando = false;
let perdio = false;
let saltando = false;

let velocidad = 13;
let gravedad = 1;
let impulsoSalto = 29;
let velocidadVertical = 0;
let posicionY = 0;

let puntaje = 0;
let record = Number(localStorage.getItem("recordCorredor")) || 0;

let obstaculos = [];
let intervaloObstaculos;
let animacion;
let vidas = 3;
let nivel = 1;
let invulnerable = false;
let tiempoObstaculos = 2300;

const pisoJugador = 180;
recordTexto.textContent = record;

/* MUSIQUITA */
let audioContext;
let tocandoMusica = false;
let intervaloMusica;
let notaActual = 0;

const melodia = [
  392, 392, 523, 392,
  659, 587, 523, 440,
  392, 440, 523, 659,
  784, 659, 587, 523
];

function iniciarMusica() {
  if (tocandoMusica) return;

  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  tocandoMusica = true;

  intervaloMusica = setInterval(() => {
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.type = notaActual % 4 === 0 ? "triangle" : "square";
    osc.frequency.value = melodia[notaActual];
    gain.gain.value = 0.045;

    osc.start();
    osc.stop(audioContext.currentTime + 0.12);

    notaActual++;

    if (notaActual >= melodia.length) {
      notaActual = 0;
    }
  }, 150);
}

function detenerMusica() {
  clearInterval(intervaloMusica);
  tocandoMusica = false;
}

btnMusica.onclick=()=>{

   musicaActiva=!musicaActiva;

   if(musicaActiva){

      iniciarMusica();

      btnMusica.innerHTML=
      "🔊 Música";

   }else{

      detenerMusica();

      btnMusica.innerHTML=
      "🔇 Silencio";

   }

}

/* JUEGO */
function iniciarJuego() {
  iniciarMusica();

  jugando = true;
  perdio = false;
  saltando = false;
  invulnerable = false;

  vidas = 3;
  nivel = 1;
  velocidad = 13;
  tiempoObstaculos = 2300;
  velocidadVertical = 0;
  posicionY = 0;
  puntaje = 0;

  vidasTexto.textContent = vidas;
  nivelTexto.textContent = nivel;
  puntajeTexto.textContent = puntaje;

  jugador.style.bottom = pisoJugador + "px";
  jugador.style.opacity = "1";

  obstaculos.forEach(obstaculo => obstaculo.elemento.remove());
  obstaculos = [];

  mensaje.classList.add("oculto");
  juego.classList.remove("pausado");

  clearInterval(intervaloObstaculos);
  intervaloObstaculos = setInterval(crearObstaculo, tiempoObstaculos);

  cancelarAnimacion();
  bucleJuego();
}

function cancelarAnimacion() {
  if (animacion) {
    cancelAnimationFrame(animacion);
  }
}

function saltar() {
  if (!jugando || perdio) {
    iniciarJuego();
    return;
  }

  if (!saltando) {
    saltando = true;
    velocidadVertical = impulsoSalto;
  }
}

function crearObstaculo() {
  if (!jugando || perdio) return;

  const elemento = document.createElement("div");
  const esHueco = Math.random() > 0.5;

  elemento.className = esHueco ? "obstaculo hueco" : "obstaculo";
  juego.appendChild(elemento);

  obstaculos.push({
    elemento,
    x: juego.clientWidth + 300,
    pasado: false,
    tipo: esHueco ? "hueco" : "normal"
  });
}

function actualizarJugador() {
  if (saltando) {
    posicionY += velocidadVertical;
    velocidadVertical -= gravedad;

    if (posicionY <= 0) {
      posicionY = 0;
      velocidadVertical = 0;
      saltando = false;
    }
  }

  jugador.style.bottom = `${pisoJugador + posicionY}px`;
}

function actualizarObstaculos() {
  obstaculos.forEach((obstaculo, index) => {
    obstaculo.x -= velocidad;
    obstaculo.elemento.style.left = `${obstaculo.x}px`;

    if (!obstaculo.pasado && obstaculo.x + obstaculo.elemento.offsetWidth < 220) {
      obstaculo.pasado = true;

      puntaje += 10;
      puntajeTexto.textContent = puntaje;

      const nuevoNivel = Math.floor(puntaje / 50) + 1;
      if (puntaje >= 500) {
   ganarJuego();
   return;
}

      if (nuevoNivel > nivel) {
        nivel = nuevoNivel;
        nivelTexto.textContent = nivel;

        velocidad += 1.4;
        tiempoObstaculos = Math.max(850, tiempoObstaculos - 180);

        clearInterval(intervaloObstaculos);
        intervaloObstaculos = setInterval(crearObstaculo, tiempoObstaculos);

        mostrarAvisoNivel();
      }
    }

    if (obstaculo.x < -400) {
      obstaculo.elemento.remove();
      obstaculos.splice(index, 1);
    }
  });
}

function perderVida(obstaculo) {
  if (invulnerable) return;

  vidas--;
  vidasTexto.textContent = vidas;

  invulnerable = true;
  jugador.style.opacity = "0.45";

  if (obstaculo) {
    obstaculo.elemento.remove();
    obstaculos = obstaculos.filter(o => o !== obstaculo);
  }

  setTimeout(() => {
    invulnerable = false;
    jugador.style.opacity = "1";
  }, 1200);

  if (vidas <= 0) {
    terminarJuego();
  }
}

function detectarColision() {
  const rectJugador = jugador.getBoundingClientRect();

  for (const obstaculo of obstaculos) {
    const rectObs = obstaculo.elemento.getBoundingClientRect();

    if (obstaculo.tipo === "normal") {
      const colision =
        rectJugador.left < rectObs.right - 30 &&
        rectJugador.right > rectObs.left + 30 &&
        rectJugador.top < rectObs.bottom - 20 &&
        rectJugador.bottom > rectObs.top + 20;

      if (colision) {
        perderVida(obstaculo);
        break;
      }
    }

    if (obstaculo.tipo === "hueco") {
      const sobreHueco =
        rectJugador.right > rectObs.left + 140 &&
        rectJugador.left < rectObs.right - 140;

      if (sobreHueco && posicionY < 45) {
        perderVida(obstaculo);
        break;
      }
    }
  }
}

function mostrarAvisoNivel() {
  const aviso = document.createElement("div");

  aviso.textContent = `NIVEL ${nivel}`;
  aviso.style.position = "absolute";
  aviso.style.top = "42%";
  aviso.style.left = "50%";
  aviso.style.transform = "translate(-50%, -50%)";
  aviso.style.zIndex = "40";
  aviso.style.fontSize = "90px";
  aviso.style.fontWeight = "bold";
  aviso.style.color = "white";
  aviso.style.textShadow = "5px 5px 0 #000";
  aviso.style.pointerEvents = "none";
  aviso.style.userSelect = "none";

  juego.appendChild(aviso);

  setTimeout(() => {
    aviso.remove();
  }, 900);
}

function ganarJuego(){

    let osc=
audioContext.createOscillator();

let gain=
audioContext.createGain();

osc.connect(gain);

gain.connect(
audioContext.destination
);

osc.frequency.value=880;

gain.gain.value=.06;

osc.start();

osc.stop(
audioContext.currentTime+.8
);
    detenerMusica();

    jugando=false;
    perdio=true;

    clearInterval(
      intervaloObstaculos
    );

    juego.classList.add(
      "pausado"
    );

    mensaje.innerHTML=`

    <div style="
    font-size:120px;
    ">
    🏆
    </div>

    <strong style="
    font-size:90px;
    color:#FFD700;
    ">
    ¡GANASTE!
    </strong>

    <p>
    Sobreviviste al caos
    </p>

    <p>
    Puntaje: ${puntaje}
    </p>

    <button id="btnReinicio">
    Volver a jugar
    </button>

    `;

    mensaje.classList.remove(
    "oculto"
    );

    document
    .getElementById(
    "btnReinicio"
    )
    .addEventListener(
    "click",
    iniciarJuego
    );

}

function terminarJuego() {
  detenerMusica();

  jugando = false;
  perdio = true;

  clearInterval(intervaloObstaculos);
  juego.classList.add("pausado");

  if (puntaje > record) {
    record = puntaje;
    localStorage.setItem("recordCorredor", record);
    recordTexto.textContent = record;
  }

  mensaje.innerHTML = `
    <strong style="font-size:80px;">FIN DEL JUEGO</strong>
    <p>Puntaje final: ${puntaje}</p>
    <p>Nivel alcanzado: ${nivel}</p>
    <button id="btnReinicio">Jugar de nuevo</button>
  `;

  mensaje.classList.remove("oculto");

  document
    .getElementById("btnReinicio")
    .addEventListener("click", iniciarJuego);
}

function bucleJuego() {
  if (!jugando) return;

  actualizarJugador();
  actualizarObstaculos();
  detectarColision();

  animacion = requestAnimationFrame(bucleJuego);
}

document.addEventListener("keydown", evento => {
  if (evento.code === "Space" || evento.code === "ArrowUp") {
    evento.preventDefault();
    saltar();
  }
});

juego.addEventListener("click", saltar);
juego.addEventListener("touchstart", saltar);
btnInicio.addEventListener("click", iniciarJuego);
</script>
</body>
</html>
